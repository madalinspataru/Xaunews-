plugins {
    id 'com.android.application'
}

android {
    namespace 'it.xaunews.app'
    compileSdk 35

    defaultConfig {
        applicationId 'it.xaunews.app'
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName '0.4'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'org.jsoup:jsoup:1.18.3'
}
